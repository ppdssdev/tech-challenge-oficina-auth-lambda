name: Auth CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Complete V2 validation (no AWS operations)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JAVA_CONTRACT_SHA: 57eb5df2c3e32fe5663596cbecfcd43a5d3ed780
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the reviewed Java pin
        run: test "$(cat JAVA_CONTRACT_SHA)" = "$JAVA_CONTRACT_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ppdssdev/tech-challenge-oficina
          ref: ${{ env.JAVA_CONTRACT_SHA }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Run the same single-command validation as external operators
        run: bash scripts/validate_external.sh "$GITHUB_WORKSPACE/producer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: auth-lambda-python313-x86_64-${{ github.sha }}
          path: |
            /tmp/lambda-v2-validation.*/lambda/dist/*
            /tmp/lambda-v2-validation.*/summary.txt
            /tmp/lambda-v2-validation.*/source-manifest.json
            /tmp/lambda-v2-validation.*/postgres-image-id.txt
            /tmp/lambda-v2-validation.*/terraform-tests.jsonl
          if-no-files-found: error
          retention-days: 7
